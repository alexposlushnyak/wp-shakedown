name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command or clicks. Paste the output if there is any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wp-shakedown version or commit
      description: Leave empty for a problem in the docs.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, PHP version, WordPress version if relevant.
