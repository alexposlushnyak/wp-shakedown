name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - package-lock.json
      - php-tools/**
      - js-tools/**
      - src/**
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - package-lock.json
      - php-tools/**
      - js-tools/**
      - src/**
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: wp-shakedown:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Print the version
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(docker run --rm wp-shakedown:test --version)
          test "$actual" = "$expected" || { echo "Expected $expected, got $actual"; exit 1; }
      - name: Run on a theme
        run: |
          set +e
          docker run --rm -v "$PWD/test/fixtures/ci-theme:/work/theme:ro" wp-shakedown:test run /work/theme --out /tmp/out --no-config --level 5 > run.out 2>&1
          code=$?
          set -e
          cat run.out
          # Exit 1 means findings, which the fixture has. Exit 2 is a failed run.
          test "$code" -le 1 || exit 1
          grep -q wpcs run.out
          # The tools are in the image, so the run installs nothing.
          if grep -q "Installing the PHP tools" run.out; then echo "The PHP tools were not in the image."; exit 1; fi

  # Only a published release writes to the registry, so only this job gets packages: write.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alexposlushnyak/wp-shakedown
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publish for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
