name: Release

# Publishes to npm when a GitHub release is published.
# It uses npm trusted publishing, so the repository holds no npm token.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Publish, unless this version is already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "wp-shakedown@$VERSION" version >/dev/null 2>&1; then
            echo "wp-shakedown@$VERSION is already on npm."
          else
            npm publish --provenance --access public
          fi
